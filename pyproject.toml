[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codelevelup"
version = "0.1.0"
description = "Local code upgrade assistant with skill, CLI, and MCP entrypoints."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
codelevelup = "codelevelup:main"
codelevelup-mcp = "codelevelup_mcp:main"

[tool.setuptools]
py-modules = ["codelevelup", "codelevelup_mcp", "probe_project"]

[tool.setuptools.package-dir]
"" = "scripts"
