[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codelevelup"
version = "0.1.0"
description = "Local code upgrade assistant with skill, CLI, and MCP entrypoints."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
codelevelup-agent = "codelevelup.agent:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
