name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codelevelup-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify project structure
        run: python tools/verify_skill_structure.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run end-to-end integration tests
        run: python -m unittest discover -s tests/e2e
